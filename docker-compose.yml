name: car-rent-3

services:
  postgres:
    image: postgres:16-alpine
    container_name: car-rental-3-postgres
    environment:
      POSTGRES_DB: car_rental
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d car_rental"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: car-rent-3-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: car-rental-3-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/car_rental
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8085:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: car-rent-3-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: car-rental-3-frontend
    ports:
      - "8084:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
